<div class="view pixelated-border" [ngStyle]="{ 'background-image': 'url(' + getBackgroundImage() + ')' }">
        <div class="map" *ngIf="run.state == 'exploration' && ready">
            <div class="location" *ngFor="let location of run.stage.locations">
                <app-location-preview [locationData]="location"
                    (exploreSignal)="moveTo(location)"></app-location-preview>
            </div>
        </div>
        <div class="location-map" *ngIf="run.state == 'location'">
            <app-location [locationData]="run.currentLocation" [selectedItem]="selectedItem" (interactSignal)="interact($event)"
                (backSignal)="returnToMap($event)" (talkSignal)="talkToActor($event)"
                (fightSignal)="engageFightWith($event)"></app-location>
        </div>
        <div class="fight" *ngIf="run.state == 'fight'">
            <app-fight [fightData]="run.currentFight" [partyData]="run.party" (attackSignal)="attack($event)"
                (fleeSignal)="flee()"></app-fight>
        </div>

</div>
