<mat-card class="mat-elevation-z1 space" [matMenuTriggerFor]="menu">
    <h6>{{locationData.name}}</h6>
    <img src="{{locationData.backgroundPath}}">
</mat-card>

<mat-menu #menu="matMenu" xPosition="before" yPosition="above" overlapTrigger="true">
    <button mat-menu-item (click)="explore()">Explore</button>
</mat-menu>
