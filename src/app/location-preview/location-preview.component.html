<mat-card [ngStyle]="{ 'background-image': 'url(' + locationData.backgroundPath + ')' }" style="background-position: center;" class="mat-elevation-z1 space pixelated-border" [matMenuTriggerFor]="menu">
    <h6 class="header">{{locationData.name}}</h6>
</mat-card>

<mat-menu #menu="matMenu" xPosition="before" yPosition="above" overlapTrigger="true">
    <button mat-menu-item (click)="explore()">Explore</button>
</mat-menu>
