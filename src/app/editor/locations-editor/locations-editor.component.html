<div style="height: 680px; width: 100%; color: white;" class="pixelated-border" class="texture">
    <div class="texture">
        <div
            style="display: flex; flex-direction: row; flex-wrap: wrap; padding-top: 25px; margin-left: 15px; margin-right: 15px;">
            <button class="pixelated-border"
                style="background-color: #A8A196; margin: 1rem; height: 175px; width: 175px" (click)="addNewLocation()"
                ngTilt [disableAxis]="'x'" [maxTilt]="1" [glare]="true" [maxGlare]="0.1" [scale]="1.02" [speed]="300">
                add new location
            </button>
            <div *ngFor="let location of savedLocations; let i = index" class="item">
                <button class="pixelated-border edit-button"
                    style="margin: 1rem; height: 175px; width: 175px; background-color: transparent; background: round;"
                    ngTilt [disableAxis]="'x'" [maxTilt]="1" [glare]="true" [maxGlare]="0.1" [scale]="1.02"
                    [speed]="300" (click)="openLocationEditorDialog(location)"
                    [ngStyle]="{ 'background-image': 'url(' + location.backgroundPath + ')' }">
                    <div style="color: white; width: 50%;">
                        <div ngTiltParallax [distance]="10" style="width: 175px;">
                            {{ location.name }}
                        </div>
                    </div>
                </button>
                <button mat-icon-button class="delete" (click)="delete(i)" mat-dialog-close ngTilt [disableAxis]="'x'" [maxTilt]="1"
                    [glare]="true" [maxGlare]="0.1" [scale]="1.02" [speed]="300">
                    <mat-icon ngTiltParallax [distance]="10">X</mat-icon>
                </button>
            </div>
        </div>
    </div>
</div>
