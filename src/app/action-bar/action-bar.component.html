<div class="action-bar pixelated-border" style="background-color: black;">
    <div class="party-members" style="padding: 15px;">
        <div *ngFor="let actor of run.party; let i = index">
            <div class="party-member space" [ngStyle]="{ 'background-image': 'url(' + actor.imagePath + ')' }">
            </div>
        </div>
    </div>
    <div [@inOutAnimation] *ngIf="inventoryOpened" class="inventory pixelated-border">
        <div style="padding: 15px;">
            <div *ngFor="let item of run.items">
                <div class="inventory-item space" [ngStyle]="{ 'background-image': 'url(' + actor.imagePath + ')' }">
                </div>
            </div>
        </div>
    </div>
    <button class="inventory-button space" style="padding: 15px;" [disabled]="inventoryDisabled" (click)="toggleInventory()">
        <img src="assets/images/bag-icon.png" />
    </button>
</div>
