<div class="container-space">
    <div *ngIf="locationData" style="height: 100%;">
        <div class="actor-row">
            <div class="actor" *ngFor="let actor of locationData.actors">
                <div *ngIf="actor" ngTilt [maxTilt]="5" [glare]="true" [maxGlare]="0.11"
                    [scale]="1.06" [speed]="300"
                    class="char-card pb-{{ actor.rarity }}"
                    (click)="setSelectedActor(actor)">

                    <!-- L0: dark BG gradient -->
                    <div class="layer layer-bg-gradient"></div>

                    <!-- L1: effect texture — depth 0.5 (±3px on cursor edge) -->
                    <div [parallaxLayer]="0.5" class="layer layer-effect"
                         [class.effect-epic]="actor.rarity === 'epic'"
                         [class.effect-legendary]="actor.rarity === 'legendary'"
                         [style.background-image]="'url(assets/cards-effects/' + effect + '.png)'"></div>

                    <!-- L1.5: rarity radial tint (static) -->
                    <div class="layer layer-rarity-tint"
                         [style.background]="'radial-gradient(ellipse at 50% 60%, ' + getRarityColor(actor.rarity) + '1a 0%, transparent 70%)'"></div>

                    <!-- L2: character art — depth 1.0 (±6px on cursor edge) -->
                    <div [parallaxLayer]="1.0" class="layer layer-art"
                         [style.background-image]="'url(' + actor.imagePath + ')'"
                         [style.filter]="'drop-shadow(0 8px 20px rgba(0,0,0,0.95)) drop-shadow(0 0 12px ' + getRarityColor(actor.rarity) + '44)'"></div>

                    <!-- L2.5: bottom fade (static) -->
                    <div class="layer layer-bottom-fade"></div>

                    <!-- L3: text content — depth 1.8 (±10.8px on cursor edge) -->
                    <div [parallaxLayer]="1.8" class="layer layer-content">
                        <span class="rarity-badge" [style.color]="getRarityColor(actor.rarity)">{{ actor.rarity }}</span>
                        <div class="char-name">{{ actor.name }}</div>
                        <div class="class-level">
                            <ng-container *ngIf="$any(actor).class?.name">
                                <span>{{ $any(actor).class?.name }}</span>
                                <span class="dot">·</span>
                            </ng-container>
                            <span>Lv.{{ actor.level }}</span>
                        </div>
                        <ng-container *ngIf="isFightable($any(actor))">
                            <div class="stat-bar">
                                <span class="bar-label hp-label">HP</span>
                                <div class="bar-track"><div class="bar-fill hp"></div></div>
                                <span class="bar-val">{{ $any(actor).stats?.healthPoints }}</span>
                            </div>
                            <div class="stat-bar">
                                <span class="bar-label sp-label">SP</span>
                                <div class="bar-track"><div class="bar-fill sp"></div></div>
                                <span class="bar-val">{{ $any(actor).stats?.skillPoints }}</span>
                            </div>
                            <div class="stat-chips">
                                <span class="stat-chip atk">ATK {{ $any(actor).stats?.strength }}</span>
                                <span class="stat-chip def">DEF {{ $any(actor).stats?.constitution }}</span>
                            </div>
                        </ng-container>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <mat-card *ngIf="!locked()" class="mat-elevation-z1 back-button space pixelated-border" (click)="goBackToScene()"
        style="height: 60px;" ngTilt [disableAxis]="'y'" [maxTilt]="1" [glare]="true" [maxGlare]="0.1" [scale]="1.01"
        [speed]="300">
        <div ngTiltParallax [distance]="10" style="padding-top: 20px; text-align: center;">Back to Stage</div>
    </mat-card>
</div>

<div #menuTrigger [matMenuTriggerFor]="selectedActor ? menu : ''" style="display: none;"></div>
<mat-menu #menu="matMenu" class="location-menu pixelated-border" (closed)="clearSelectedActor()">
    <div *ngIf="selectedActor">
        <!-- use action -->
        <button *ngIf="uiService.getSelectedItem()" mat-menu-item (click)="runService.useItemOn(uiService.getSelectedItem(), selectedActor!)"> use </button>
        <!-- cast skill action -->
        <button *ngIf="uiService.getSelectedSkill()" mat-menu-item (click)="castSkillOnActor(selectedActor!)"> cast {{uiService.getSelectedSkill()?.name}} </button>
        <!-- talk action -->
        <button mat-menu-item *ngIf="hasDialogue(selectedActor!)" (click)="talk(selectedActor!)"> interact </button>
        <!-- fight action (if is fightable -> has stats)-->
        <button mat-menu-item *ngIf="isFightable($any(selectedActor!))" (click)="engageCombat(selectedActor!)"> fight
        </button>
        <!-- shop action (if npc has items in shop property) -->
        <button mat-menu-item *ngIf="hasShop(selectedActor!)" (click)="toggleShop(selectedActor!)"> shop </button>
        <!-- rest action (if npc has rest property) -->
        <button mat-menu-item *ngIf="canMakeYouRest(selectedActor!)" (click)="rest()"> rest </button>
        <!-- revive action (if npc can revive and party has dead members) -->
        <button mat-menu-item *ngIf="canRevive(selectedActor!)" (click)="revive()"> revive </button>
    </div>
</mat-menu>
