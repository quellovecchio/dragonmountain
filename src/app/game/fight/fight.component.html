<div class="battlefield-wrapper">
    <div #battlefield class="battlefield">
        <div [style.opacity]="fightStartAnimation ? 1 : 0" style="height: 100%; width: 100%;" (click)="skipIntro()">
            <div class="scene">
                <div class="sideLeft superSpeed">
                    <div class="intro-thumbnail-container">
                        <div class="imgA" *ngFor="let actor of partyData; let i = index"
                            [ngStyle]="{ 'background-image': 'url(' + actor.imagePath + ')' }"
                            [ngClass]="partyData.length == 1 ? 'full-portrait' : partyData.length == 2 ? 'half-portrait' : 'third-portrait'">
                        </div>
                    </div>
                </div>
                <div class="sideRight superSpeed">
                    <div class="intro-thumbnail-container">
                        <div class="imgB" *ngFor="let enemy of fightData; let j = index"
                            [ngStyle]="{ 'background-image': 'url(' + enemy.imagePath + ')' }"
                            [ngClass]="fightData.length == 1 ? 'full-portrait' : fightData.length == 2 ? 'half-portrait' : 'third-portrait'">
                        </div>
                    </div>
                </div>
                <div class="vs"></div>
                <div class="speed-anim"></div>
            </div>
        </div>
        <div class="battlefield-actors"
            style="position:absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;"
            [style.opacity]="!fightStartAnimation ? 1 : 0">
            <!-- Template for spawning characters -->
            <div #partyCharacter class="pawn" *ngFor="let actor of partyData; let i = index"
                [class.damaged]="actor.damaged" [class.active]="actor.active"
                (click)="partyMemberClicked(actor); $event.stopPropagation();"
                style="pointer-events: auto;">
                <div *ngIf="actor" class="party-member pixelated-border space"
                    style="background-position-x: center; background-position-y: top; background-size: 200%; z-index: 30; position: relative;"
                    [style.pointer-events]="action.actionType == 'skill' && !selectedSkill ? 'none' : 'auto'"
                    [ngStyle]="{ 'background-image': 'url(' + actor.imagePath + ')' }" [class.disabled]="actor.dead">
                    <app-data-bar [minimized]="true" class="hp-bar" [currentValue]="actor.stats.healthPoints"
                        [maxValue]="actor.stats.constitution" [barType]="1">
                    </app-data-bar>
                    <app-data-bar [minimized]="true" class="hp-bar" [currentValue]="actor.stats.skillPoints"
                        [maxValue]="actor.stats.intelligence" [barType]="2">
                    </app-data-bar>
                </div>
                <div class="action-range" *ngIf="actor.active == true && actor.id == currentCharacter.id"
                    [ngStyle]="{ 'height': getActionRangeDiameter(actor).diameter, 'width': getActionRangeDiameter(actor).diameter, 'left': getActionRangeDiameter(actor).left, 'top': getActionRangeDiameter(actor).top }">
                    <ng-container *ngIf="action.actionType == ''">
                        <div class="action-range-button skill-button"
                            (click)="skillButtonClicked(); $event.stopPropagation();"
                            [ngStyle]="{'border-top-left-radius': getActionRangeDiameter(actor).diameter, 'border-bottom-left-radius': getActionRangeDiameter(actor).diameter}">
                            <img class="action-range-icon" src="assets/icons/skill-icon.png">
                        </div>
                        <div class="action-range-button move-attack-button"
                            (click)="moveAttackButtonClicked(); $event.stopPropagation();"
                            [ngStyle]="{'border-top-right-radius': getActionRangeDiameter(actor).diameter, 'border-bottom-right-radius': getActionRangeDiameter(actor).diameter}">
                            <img class="action-range-icon" src="assets/icons/attack-icon.png">
                        </div>
                    </ng-container>
                    <!-- skill wheel: shown after skill button is clicked, before a skill is chosen -->
                    <ng-container *ngIf="action.actionType == 'skill' && !selectedSkill">
                        <svg class="skill-wheel" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"
                            (click)="$event.stopPropagation()">
                            <defs>
                                <clipPath id="skill-wheel-clip">
                                    <circle cx="100" cy="100" r="100"/>
                                </clipPath>
                            </defs>
                            <g clip-path="url(#skill-wheel-clip)">
                                <ng-container *ngIf="actor.skills.length > 0; else noSkills">
                                    <g *ngFor="let slice of getSkillWheelSlices(actor.skills); trackBy: trackBySkillSlice">
                                        <path [attr.d]="slice.path" class="skill-slice"
                                            [class.hovered]="hoveredSkillId === slice.skill.id"
                                            (mouseenter)="hoveredSkillId = slice.skill.id"
                                            (mouseleave)="hoveredSkillId = undefined"
                                            (click)="selectSkillFromMenu(slice.skill); $event.stopPropagation()">
                                        </path>
                                        <text [attr.x]="slice.textX" [attr.y]="slice.textY - 7"
                                            class="skill-slice-label" text-anchor="middle" dominant-baseline="middle"
                                            (click)="selectSkillFromMenu(slice.skill); $event.stopPropagation()">
                                            {{ slice.skill.name }}
                                        </text>
                                        <text [attr.x]="slice.textX" [attr.y]="slice.textY + 9"
                                            class="skill-slice-cost" text-anchor="middle" dominant-baseline="middle"
                                            (click)="selectSkillFromMenu(slice.skill); $event.stopPropagation()">
                                            {{ slice.skill.cost }} SP
                                        </text>
                                    </g>
                                </ng-container>
                                <ng-template #noSkills>
                                    <circle cx="100" cy="100" r="100" class="skill-slice" style="cursor: default;"></circle>
                                    <text x="100" y="100" class="skill-slice-label" text-anchor="middle" dominant-baseline="middle">No skills</text>
                                </ng-template>
                            </g>
                        </svg>
                    </ng-container>
                    <ng-container *ngIf="action.actionType != '' && !(action.actionType == 'skill' && !selectedSkill)">
                        <div class="range"
                            [ngClass]="action.actionType == 'attack' ? 'move-attack-button' : 'skill-button'"
                            [ngStyle]="{'border-radius': getActionRangeDiameter(actor).diameter}">
                        </div>
                    </ng-container>
                </div>
                <i *ngIf="currentCharacter == actor"></i>
            </div>
            <!-- Template for spawning enemies -->
            <div #enemyCharacter class="pawn" *ngFor="let actor of fightData; let i = index"
                [class.damaged]="actor.damaged" (click)="enemyClicked(actor)" style="pointer-events: auto;">
                <div *ngIf="actor" class="party-member pixelated-border space"
                    style="background-position-x: center; background-position-y: top; background-size: 200%;  z-index: 30"
                    [ngStyle]="{ 'background-image': 'url(' + actor.imagePath + ')' }"
                    [ngClass]="actor.dead ? 'dead' : ''">
                    <app-data-bar [minimized]="true" class="hp-bar" [currentValue]="actor.stats.healthPoints"
                        [maxValue]="actor.stats.constitution" [barType]="1">
                    </app-data-bar>
                    <app-data-bar [minimized]="true" class="hp-bar" [currentValue]="actor.stats.skillPoints"
                        [maxValue]="actor.stats.intelligence" [barType]="2">
                    </app-data-bar>
                </div>
                <i *ngIf="action.actionType != ''"></i>
            </div>
        </div>
        <div class="animations" *ngIf="!fightStartAnimation"
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
            <!-- Missiles are appended here directly via DOM (see createMissileElement) -->
        </div>
        <div *ngIf="action.actionType == 'attack'" class="help">Select an enemy to attack, or click the battlefield to cancel.</div>
        <div *ngIf="action.actionType == 'skill' && !selectedSkill" class="help">Select a skill, or click the battlefield to cancel.</div>
        <div *ngIf="action.actionType == 'skill' && selectedSkill" class="help">{{ selectedSkill.name }} — select a target. Click the battlefield to cancel.</div>
    </div>
</div>
