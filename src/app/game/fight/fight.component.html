<div class="battlefield">
    <div class="characters" style="position:absolute; top: 300px;">
        <!-- Template for spawning characters -->
        <div #partyCharacter class="pawn" *ngFor="let actor of partyData; let i = index" style="width: 100px; height: 100px; float: left;" [class.damaged]="actor.damaged"> 
            <div *ngIf="actor" class="party-member pixelated-border space" style="background-position-x: center; background-position-y: top; background-size: 200%;"
                [ngStyle]="{ 'background-image': 'url(' + actor.imagePath + ')' }" [class.disabled]="actor.dead">
                <app-data-bar [minimized]="true" class="hp-bar"
                    [currentValue]="actor.stats.healthPoints" [maxValue]="actor.stats.constitution" [barType]="1">
                </app-data-bar>
                <app-data-bar [minimized]="true" class="hp-bar"
                    [currentValue]="actor.stats.skillPoints" [maxValue]="actor.stats.intelligence" [barType]="2">
                </app-data-bar>
            </div>
        </div>
    </div>
    <div class="enemies" style="position:absolute; top: 300px;">
        <!-- Template for spawning enemies -->
        <div #enemyCharacter class="pawn" *ngFor="let actor of fightData; let i = index" style="width: 100px; height: 100px; float: right;" [class.damaged]="actor.damaged"> 
            <div *ngIf="actor" class="party-member pixelated-border space" style="background-position-x: center; background-position-y: top; background-size: 200%;"
                [ngStyle]="{ 'background-image': 'url(' + actor.imagePath + ')' }" [class.disabled]="actor.dead">
                <app-data-bar [minimized]="true" class="hp-bar"
                    [currentValue]="actor.stats.healthPoints" [maxValue]="actor.stats.constitution" [barType]="1">
                </app-data-bar>
                <app-data-bar [minimized]="true" class="hp-bar"
                    [currentValue]="actor.stats.skillPoints" [maxValue]="actor.stats.intelligence" [barType]="2">
                </app-data-bar>
            </div>
        </div>
    </div>
    <div class="animations">
        <!-- Template for animations spawn -->
        <div class="animation" *ngFor="let animation of animations; let i = index"> 
            <img style="width: 75px; height: 75px; position: absolute; bottom: 10px;" [src]="animation.source" [style.transform]="getAnimationTransform(animation)"/>
        </div>
    </div>
</div>
