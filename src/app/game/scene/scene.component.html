<div class="view">
    <div class="map" *ngIf="runService.getRun().state == 'exploration' && !runService.getRun().showBossfightLocation && ready">
        <div class="locations-row">
            <div class="location-preview" *ngFor="let location of runService.getRun().stage.currentLocations">
                <app-location-preview [location]="location" (exploreSignal)="moveTo(location)"></app-location-preview>
            </div>
        </div>
    </div>
    <div class="map" *ngIf="runService.getRun().state == 'exploration' && runService.getRun().showBossfightLocation && ready">
        <div style="display: flex !important; height: 100% !important; justify-content: space-evenly !important;">
            <app-location-preview [locationData]="runService.getRun().stage.bossLocation"
                (exploreSignal)="moveTo(runService.getRun().stage.bossLocation)"></app-location-preview>
        </div>
    </div>
    <div class="location" *ngIf="runService.getRun().state == 'location'">
        <app-location [locationData]="runService.getRun().currentLocation" [selectedItem]="selectedItem"
            (interactSignal)="interact($event)" (backSignal)="returnToMap($event)" (talkSignal)="talkToActor($event)"
            (openShopSignal)="toggleShop($event)" (fightSignal)="engageFightWith($event)"
            (restSignal)="rest()"></app-location>
    </div>
    <div class="fight" *ngIf="runService.getRun().state == 'fight'">
        <app-fight [fightSpeed]="fightSpeed" [fightData]="runService.getRun().currentFight" [partyData]="runService.getRun().party"
            (attackSignal)="attack($event)" (useSkillSignal)="useSkillOn($event)" (fleeSignal)="flee()"></app-fight>
    </div>
    <div class="intro" *ngIf="runService.getRun().state == 'intro'">
        <!--<video controls loop>
            <source src="../assets/animation.mp4" type="video/mp4">
        </video>-->
    </div>
    <!-- shop -->
    <div [@inOutAnimationShop] *ngIf="shopOpened" class="shop pixelated-border"
        style="overflow-y: auto; overflow-x: hidden;">
        <div class="close-shop-button pixelated-border" (click)="toggleShop()">CLOSE</div>
        <app-items-table [dataSource]="shopDataSource" [compact]="false" (clickEvent)="buy($event)">
        </app-items-table>
    </div>
</div>
