<div class="space">
    <button [matMenuTriggerFor]="menu">
        <p class="header">{{locationData.name}}</p>
        <img src="{{locationData.backgroundPath}}">
        <mat-menu #menu="matMenu" yPosition="below" xPosition="after">
            <button mat-menu-item (click)="explore()">Explore</button>
        </mat-menu>
    </button>
</div>
