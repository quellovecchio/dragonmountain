<div class="space">
    <div class="actorsSpace" *ngIf="fightData" style="height: 100%;">
        <div class="enemy" *ngFor="let actor of fightData; let i = index" [style]="'width: ' + getActorWidth() + '%;'"> <!-- fightData.length - 3 because 3 is max umber of enemies-->
            <mat-card [ngStyle]="{ 'background-image': 'url(' + actor.imagePath + ')' }" class="mat-elevation-z1 space image-bg" [matMenuTriggerFor]="menu">
                <h6 class="header">{{actor.name}}</h6>
                <!--<img style="height: 70%;" src="{{actor.imagePath}}">-->
                <mat-menu #menu="matMenu" yPosition="below" xPosition="after">
                    <button mat-menu-item (click)="attack(i)">attack</button>
                    <!-- spells -->
                    <!-- items -->
                </mat-menu>
            </mat-card>
        </div>
    </div>
</div>
